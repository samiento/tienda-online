<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>checkout</title>
</head>

<body>

    <h1>Checkout</h1>
    <fieldset>
      <legend>Metodo de Pago</legend>
    <p>Método de pago:</p>
    <input type="radio" id="tarjeta" name="pago" value="tarjeta">
    <label for="tarjeta">Tarjeta</label>

    <input type="radio" id="transferencia" name="pago" value="transferencia">
    <label for="transferencia">Transferencia</label>

    <input type="checkbox" id="newsletter" name="newsletter" value="si">
    <label for="newsletter">Quiero recibir ofertas por email</label>


    <button type="submit">Enviar consulta</button>


    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required minlength="3">

    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" name="cantidad" min="1" max="10" required>
    </fieldset>

    <fieldset>
      <legend>Datos de envío</legend>
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" required>
    </fieldset>


    <button>Comprar</button>
    <button>Finalizá tu compra</button>
    

    <a href="index.html"></a>
    <a href="contacto.html"></a>
    <a href="producto.html"></a>

    <footer>
      <p>&copy; 2026 Tienda Virtual. Cba. Rio IV.</p>
      <a href="mailto:hola@tiendavirtual.com">hola@tiendavirtual.com</a>
    </footer>

</body>

</html>
