<!DOCTYPE html>
<html lang="es">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>checkout</title>
</head>

<header>
    <div class="barra">
      <h1 class="logo">Checkout</h1>
    <nav class="nav">
      <ul class="menu1">
        <li><a href="index.html">Inicio</a></li>

        <li><a href="checkout.html">Finalizar compra</a></li>
      </ul>
    </nav>
   </div>
</header>

<body>

    <fieldset>
      <legend>Metodo de Pago</legend>
    
    <input type="radio" id="tarjeta" name="pago" value="tarjeta">
    <label for="tarjeta">Tarjeta</label>

    <input type="radio" id="transferencia" name="pago" value="transferencia">
    <label for="transferencia">Transferencia</label>

    <input type="checkbox" id="newsletter" name="newsletter" value="si">
    <label for="newsletter">Quiero recibir ofertas por email</label>


    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required minlength="3">

    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" name="cantidad" min="1" max="10" required>
    </fieldset>

    <fieldset>
      <legend>Datos de envío</legend>
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" required>
    </fieldset>

    
    <button type="submit">Comprar</button>
    <button type="submit">Finalizá tu compra</button>
