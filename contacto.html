<body>

  <fieldset>
    <legend>Consultas</legend>
    <p class="p">¿Tenés una consulta? Escribinos<br> y te respondemos en 24 horas.</p>

    <form action="#" method="post">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required minlength="3">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="motivo">Motivo</label>
      <select id="motivo" name="motivo">
        <option value="consulta">Consulta sobre un producto</option>
        <option value="reclamo">Reclamo</option>
        <option value="otro">Otro</option>
      </select>

      <label for="provincia">Provincia</label>
      <select id="provincia" name="provincia">
        <option value="">Elegí una provincia</option>
        <option value="misiones">Cordoba</option>
        <option value="corrientes">Corrientes</option>
        <option value="buenos-aires">Buenos Aires</option>
      </select>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar consulta</button>


  </fieldset>
